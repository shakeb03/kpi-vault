services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi_dev_only
      POSTGRES_DB: definition_safe_bi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi -d definition_safe_bi"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    ports:
      - "3848:3848"
    environment:
      PORT: "3848"
      DATABASE_URL: postgres://bi:bi_dev_only@postgres:5432/definition_safe_bi
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "3847:80"
    depends_on:
      - api

volumes:
  pgdata:
